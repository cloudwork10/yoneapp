# Railway - عند ربط المستودع حدد Root Directory = backend
#
# تخزين دائم للملفات (صور / فيديو / CV):
# 1) من لوحة Railway → Service → Volumes → Add Volume
# 2) Mount Path = /app/uploads
# 3) أعد النشر — الملفات تفضل بعد كل deploy

[build]
builder = "nixpacks"
buildCommand = "npm install"

[deploy]
startCommand = "npm start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
